// Pure bounded-use permit. Authentication, trusted time, usage and persistence belong to the host.
const TEMP_ACCESS_PHASES=['AVAILABLE','CHALLENGE_REQUIRED','CHALLENGE_ACTIVE','REST_REQUIRED','DAILY_LOCKED','SCHEDULE_LOCKED'];
const TEMP_ACCESS_REASONS=[null,'parent_closed','expired','budget_exhausted','clock_rollback'];
class TemporaryAccessError extends Error {
 constructor(code){super('Temporary access rejected: '+code);this.name='TemporaryAccessError';this.code=code;}
}
function taCheck(ok,code='INVALID_ACCESS'){if(!ok)throw new TemporaryAccessError(code);}
function taInteger(n){return Number.isSafeInteger(n)&&n>=0;}
function taFields(v,keys){taCheck(v!==null&&typeof v==='object'&&!Array.isArray(v)&&Object.keys(v).length===keys.length&&keys.every(k=>Object.hasOwn(v,k)));}
function taContext(v){
 taFields(v,['nowMs','phase','cycleRemainingSeconds','dailyRemainingSeconds']);
 taCheck(taInteger(v.nowMs)&&TEMP_ACCESS_PHASES.includes(v.phase)&&taInteger(v.cycleRemainingSeconds)&&taInteger(v.dailyRemainingSeconds));return v;
}
function validateTemporaryAccess(value){
 taFields(value,['version','permitId','issuedAtMs','expiresAtMs','budgetSeconds','usedSeconds','lastObservedAtMs','closedReason']);
 taCheck(value.version===1&&typeof value.permitId==='string'&&value.permitId.trim()===value.permitId&&value.permitId.length>0&&value.permitId.length<=128);
 taCheck(['issuedAtMs','expiresAtMs','budgetSeconds','usedSeconds','lastObservedAtMs'].every(k=>taInteger(value[k])));
 taCheck(value.budgetSeconds>=60&&value.budgetSeconds<=1800&&value.budgetSeconds%60===0&&value.usedSeconds<=value.budgetSeconds);
 taCheck(value.expiresAtMs-value.issuedAtMs===value.budgetSeconds*1000&&value.lastObservedAtMs>=value.issuedAtMs&&TEMP_ACCESS_REASONS.includes(value.closedReason));
 taCheck(value.closedReason!==null||(value.usedSeconds<value.budgetSeconds&&value.lastObservedAtMs<value.expiresAtMs));
 taCheck(value.closedReason!=='expired'||value.lastObservedAtMs>=value.expiresAtMs);
 taCheck(value.closedReason!=='budget_exhausted'||value.usedSeconds===value.budgetSeconds);
 return {...value};
}
function createTemporaryAccess(request,trustedContext){
 taFields(request,['permitId','minutes']);const c=taContext(trustedContext);
 taCheck(Number.isInteger(request.minutes)&&request.minutes>=1&&request.minutes<=30,'INVALID_REQUEST');
 taCheck(c.phase==='AVAILABLE','NOT_AVAILABLE');const budgetSeconds=request.minutes*60;
 taCheck(budgetSeconds<=c.cycleRemainingSeconds&&budgetSeconds<=c.dailyRemainingSeconds,'INSUFFICIENT_ALLOWANCE');
 return validateTemporaryAccess({version:1,permitId:request.permitId,issuedAtMs:c.nowMs,expiresAtMs:c.nowMs+budgetSeconds*1000,budgetSeconds,usedSeconds:0,lastObservedAtMs:c.nowMs,closedReason:null});
}
function getTemporaryAccessStatus(value,trustedContext){
 const s=validateTemporaryAccess(value),c=taContext(trustedContext);
 const reason=s.closedReason??(c.nowMs<s.lastObservedAtMs?'clock_rollback':c.nowMs>=s.expiresAtMs?'expired':c.phase!=='AVAILABLE'?'guardian_blocked':c.cycleRemainingSeconds===0||c.dailyRemainingSeconds===0?'allowance_exhausted':null);
 const remainingSeconds=reason===null?Math.min(s.budgetSeconds-s.usedSeconds,Math.floor((s.expiresAtMs-c.nowMs)/1000),c.cycleRemainingSeconds,c.dailyRemainingSeconds):0;
 return {permitId:s.permitId,active:reason===null,reason,remainingSeconds,expiresAtMs:s.expiresAtMs,usedSeconds:s.usedSeconds,budgetSeconds:s.budgetSeconds,advisoryOnly:true};
}
function observeTemporaryAccess(value,sample){
 const s=validateTemporaryAccess(value);taFields(sample,['nowMs','usedSeconds']);taCheck(taInteger(sample.nowMs)&&taInteger(sample.usedSeconds),'INVALID_SAMPLE');
 if(s.closedReason!==null){taCheck(sample.usedSeconds===0,'ACCESS_INACTIVE');return s;}
 if(sample.nowMs<s.lastObservedAtMs){taCheck(sample.usedSeconds===0,'ACCESS_INACTIVE');return {...s,closedReason:'clock_rollback'};}
 if(sample.nowMs>=s.expiresAtMs){taCheck(sample.usedSeconds===0,'ACCESS_INACTIVE');return {...s,lastObservedAtMs:sample.nowMs,closedReason:'expired'};}
 taCheck(sample.usedSeconds<=s.budgetSeconds-s.usedSeconds,'BUDGET_EXCEEDED');
 const usedSeconds=s.usedSeconds+sample.usedSeconds;
 return {...s,usedSeconds,lastObservedAtMs:sample.nowMs,closedReason:usedSeconds===s.budgetSeconds?'budget_exhausted':null};
}
function closeTemporaryAccess(value,nowMs){
 const s=observeTemporaryAccess(value,{nowMs,usedSeconds:0});return s.closedReason===null?{...s,closedReason:'parent_closed'}:s;
}
// END BEAA TEMPORARY ACCESS

const defaults={page:"home",period:30,dailyLimit:120,rest:10,grade:3,subject:"all",topic:"all",questionCount:5,requiredCorrect:5,dailyUsed:0,cycleUsed:0,dailyRemainderSeconds:0,cycleRemainderSeconds:0,question:0,correct:0,answerNote:"",phase:"available",restStart:0,activeQuestions:[],attempted:[],mistakes:[],history:[],bank:[],pinHash:null,pinSalt:null,failedPins:0,lockUntil:0,lastTime:0,day:"",audit:[],permit:null};
function clean(v,min,max,def){return Number.isInteger(v)&&v>=min&&v<=max?v:def;}
function validQuestion(q){return q&&typeof q.id==='string'&&q.id.length>0&&q.id.length<=80&&Number.isInteger(q.grade)&&q.grade>=1&&q.grade<=6&&Object.hasOwn(subjects,q.subject)&&Object.hasOwn(topics,q.topic)&&typeof q.text==='string'&&q.text.length>0&&q.text.length<=1000&&Array.isArray(q.options)&&q.options.length>=2&&q.options.length<=8&&q.options.every(o=>typeof o==='string'&&o.length>0&&o.length<=500)&&new Set(q.options).size===q.options.length&&Number.isInteger(q.answer)&&q.answer>=0&&q.answer<q.options.length&&typeof q.explain==='string'&&q.explain.length<=2000;}
function validateBank(bank){if(!Array.isArray(bank)||!bank.length||bank.length>2000||!bank.every(validQuestion)||new Set(bank.map(q=>q.id)).size!==bank.length)throw Error('题库格式错误：需 1–2000 道有效且 ID 唯一的题目');return bank;}
function dayKey(now){const d=new Date(now);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function restore(raw){try{

  if(!x||typeof x!=="object"||Array.isArray(x)||Object.entries(ranges).some(([k,[min,max]])=>!Object.hasOwn(x,k)||clean(x[k],min,max,null)===null)||!['available','challenge','answering','rest','daily'].includes(x.phase)||typeof x.day!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(x.day)||new Date(x.day+'T12:00:00Z').toISOString().slice(0,10)!==x.day)recoveryBlocked=true;

 }
 for(const [k,min,max] of [["dailyRemainderSeconds",0,59],["cycleRemainderSeconds",0,59],["period",5,120],["dailyLimit",15,600],["rest",0,60],["grade",1,6],["questionCount",1,20],["requiredCorrect",1,20],["dailyUsed",0,600],["cycleUsed",0,600],["question",0,20],["correct",0,20],["restStart",0,Number.MAX_SAFE_INTEGER],["failedPins",0,5],["lockUntil",0,Number.MAX_SAFE_INTEGER],["lastTime",0,Number.MAX_SAFE_INTEGER]]) s[k]=clean(x?.[k],min,max,s[k]);
 for(const [k,allowed] of Object.entries({page:['home','quiz','success','settings','review','records'],phase:['available','challenge','answering','rest','daily'],subject:['all',...Object.keys(subjects)],topic:['all',...Object.keys(topics)]}))if(allowed.includes(x?.[k]))s[k]=x[k];
 if(s.requiredCorrect>s.questionCount)s.requiredCorrect=s.questionCount;
 if(Array.isArray(x?.activeQuestions)&&x.activeQuestions.length<=20&&x.activeQuestions.every(validQuestion))s.activeQuestions=x.activeQuestions;

 if(Array.isArray(x?.history))s.history=x.history.filter(r=>Number.isFinite(r?.at)&&Number.isInteger(r.total)&&r.total>0&&r.total<=20&&Number.isInteger(r.correct)&&r.correct>=0&&r.correct<=r.total&&typeof r.passed==='boolean').slice(-200);
 if(Array.isArray(x?.audit))s.audit=x.audit.filter(r=>Number.isFinite(r?.at)&&['settings','reset','unlock','import','permit_issue','permit_end','permit_stop','export'].includes(r.type)).slice(-100).map(r=>({type:r.type,at:r.at,...(Number.isInteger(r.minutes)&&r.minutes>=1&&r.minutes<=30?{minutes:r.minutes}:{} )}));

function structuredDefaults(){return {...defaults,activeQuestions:[],attempted:[],mistakes:[],history:[],bank:[],audit:[]};}
const el=document.getElementById("app"),nav=document.getElementById("nav");
let pendingNativeExport=null,nativeExportTimer=null;

const escapeHTML=x=>String(x).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));

function save(){if(recoveryBlocked)return false;try{const raw=localStorage.getItem(STORAGE);if(raw!==lastSaved){syncState();s.answerNote='检测到其他页面更新，已恢复最新进度，请重试操作。';return false;}const serialized=JSON.stringify(s);localStorage.setItem(STORAGE,serialized);lastSaved=serialized;storageError=false;return true;}catch{storageError=true;return false;}}
function permitContext(){return {nowMs:Date.now(),phase:{available:'AVAILABLE',challenge:'CHALLENGE_REQUIRED',answering:'CHALLENGE_ACTIVE',rest:'REST_REQUIRED',daily:'DAILY_LOCKED'}[s.phase],cycleRemainingSeconds:Math.max(0,(s.period-s.cycleUsed)*60-s.cycleRemainderSeconds),dailyRemainingSeconds:Math.max(0,(s.dailyLimit-s.dailyUsed)*60-s.dailyRemainderSeconds)};}

function authorized(){if(Date.now()<parentUntil)return true;s.answerNote='请先完成家长验证。';s.page='settings';save();render();return false;}
function audit(type,details={}){s.audit.push({type,at:Date.now(),...details});s.audit=s.audit.slice(-100);}
function usableSeconds(){if(s.phase!=='available')return 0;const c=permitContext();let remaining=Math.min(c.cycleRemainingSeconds,c.dailyRemainingSeconds);if(s.permit)remaining=Math.min(remaining,getTemporaryAccessStatus(s.permit,c).remainingSeconds);return remaining;}

 if(s.permit){s.permit=observeTemporaryAccess(s.permit,{nowMs:Date.now(),usedSeconds:counted});if(s.permit.closedReason)audit('permit_stop');}
