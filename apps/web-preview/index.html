<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>学知守护 · 交互原型</title>
<style>
:root{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#194e54;background:#eef8f5}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:13px;padding:12px 18px;min-height:48px}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #318e91;outline-offset:3px}.primary{background:#086e6b;color:white}.secondary{background:#e3f3ef;color:#176c70}.danger{background:#fff1e7;color:#99552a}.layout{max-width:1180px;margin:auto;padding:24px}.top{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}.brand{font-size:28px;font-weight:800;color:#118684}.pill{border:1px solid #e5caa7;border-radius:24px;background:#fff7e9;padding:7px 13px;color:#8c6026;font-size:13px}nav{display:flex;gap:8px;flex-wrap:wrap}nav button[aria-current=page]{background:#086e6b;color:white}main{min-height:420px}.card{background:#fff;border-radius:24px;padding:27px;box-shadow:0 9px 34px #1f8b7610}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.full{grid-column:1/-1}h1{font-size:clamp(25px,3vw,38px);margin:0 0 12px}h2{margin:0 0 15px;font-size:22px}p{line-height:1.65}.muted{color:#496a6b}.big{font-size:clamp(42px,7vw,77px);font-weight:800;color:#0d8a88}.stat{font-size:22px;font-weight:700;margin:14px 0}.choices{display:grid;gap:12px}.choices button{text-align:left;background:#ddf3ee;font-size:20px;min-height:63px}.choices button:hover{background:#c9ebe3}.bar{height:12px;border-radius:12px;background:#e4efeb;overflow:hidden}.bar>div{height:100%;background:#46afa1;transition:width .25s}.formrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:14px 0;flex-wrap:wrap}input,select{border:1px solid #b9dcd6;border-radius:12px;padding:10px;background:#fff;min-width:105px;max-width:100%}.result{text-align:center}.emoji{font-size:75px}.notice{background:#fff7e9;border-radius:14px;padding:13px;color:#94622b}.ok{color:#087e6b}.error{color:#a64c3e}footer{font-size:13px;color:#486969;margin-top:26px;text-align:center}@media(max-width:760px){.layout{padding:14px}.card{padding:20px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.top{align-items:flex-start;flex-direction:column}.brand{font-size:24px}.choices button{font-size:19px}}

<body>
<div class="layout">
<header class="top"><div><div class="brand">📚 学知守护</div><div class="muted">让学习与快乐陪伴成长</div></div><span class="pill">浏览器演示 · 不具备设备管控权限</span></header>
<nav id="nav" aria-label="页面导航"></nav><main id="app" aria-live="polite"></main>
<footer>所有时间均为模拟测试数据，不能限制其他应用。此原型本地运行，不上传学习记录。</footer>
</div>
<script>
"use strict";
const STORAGE="beaa-web-preview-v1";
const questions=[
 {subject:"数学",text:"36 ÷ 4 + 7 = ?",options:["14","15","16","17"],answer:2,explain:"先算36÷4=9，再算9+7=16。"},
 {subject:"数学",text:"8 × 6 = ?",options:["42","48","54","56"],answer:1,explain:"8×6=48。"},
 {subject:"语文",text:"“春眠不觉晓”的下一句是？",options:["处处闻啼鸟","花落知多少","夜来风雨声","床前明月光"],answer:0,explain:"出自孟浩然《春晓》。"},
 {subject:"英语",text:"apple 的中文意思是什么？",options:["梨","香蕉","苹果","橙子"],answer:2,explain:"apple是苹果。"},
 {subject:"数学",text:"15 + 17 = ?",options:["30","31","32","33"],answer:2,explain:"15+17=32。"}
];
const subjects={math:"数学",chinese:"语文",english:"英语"};
const topics={arithmetic:"计算",poetry:"语言积累",vocabulary:"词汇"};
// 样例仅供流程验证，不代表完整教学大纲。
const language=[
 ["日|太阳|月亮","山|山峰|河流","水|河水|火焰","木|树木|石头","人|人类|鸟类"],
 ["春|春天|冬天","秋|秋天|夏天","明|明亮|黑暗","早|早晨|夜晚","多|很多|很少"],
 ["春眠不觉晓|处处闻啼鸟|床前明月光","床前明月光|疑是地上霜|花落知多少","白日依山尽|黄河入海流|处处闻啼鸟","谁知盘中餐|粒粒皆辛苦|疑是地上霜","欲穷千里目|更上一层楼|黄河入海流"],
 ["静|安静|热闹","诚|诚实|欺骗","勤|勤奋|懒惰","勇|勇敢|胆怯","善|善良|凶恶"],
 ["持之以恒|坚持不懈|半途而废","井然有序|整齐有条理|杂乱无章","专心致志|集中注意力|三心二意","实事求是|依据事实|凭空猜测","饮水思源|不忘根本|忘恩负义"],
 ["温故知新|复习旧知获得新知|只学新知识","学而不厌|学习不感到满足|拒绝学习","不耻下问|乐于向不如自己的人请教|不愿提问","举一反三|由一件事推知同类事物|机械重复","见贤思齐|向优秀的人学习|嫉妒别人"]
];
const words=[
 ["cat|猫|狗","dog|狗|猫","red|红色|蓝色","one|一|二","sun|太阳|月亮"],
 ["book|书|笔","pen|钢笔|书","blue|蓝色|红色","two|二|三","moon|月亮|太阳"],
 ["apple|苹果|香蕉","school|学校|医院","teacher|老师|医生","green|绿色|红色","water|水|牛奶"],
 ["library|图书馆|操场","breakfast|早餐|晚餐","weather|天气|季节","cloudy|多云的|晴朗的","healthy|健康的|饥饿的"],
 ["exercise|锻炼|休息","science|科学|音乐","usually|通常|从不","careful|小心的|粗心的","village|村庄|城市"],
 ["environment|环境|温度","protect|保护|破坏","responsible|负责的|随意的","knowledge|知识|力量","improve|改善|降低"]
];
const builtIn=[];
for(let grade=1;grade<=6;grade++){
 for(let i=0;i<5;i++){
  const a=grade*7+i+1,b=grade+i+1,n=a+b;
  builtIn.push({id:`math-${grade}-${i}`,grade,subject:"math",topic:"arithmetic",text:`${a} + ${b} = ?`,options:[String(n-1),String(n),String(n+1)],answer:1,explain:`${a}+${b}=${n}。`});
  for(const [subject,rows,topic] of [["chinese",language,"poetry"],["english",words,"vocabulary"]]){
   const [word,right,wrong]=rows[grade-1][i].split('|');
   builtIn.push({id:`${subject}-${grade}-${i}`,grade,subject,topic,text:subject==="english"?`${word} 的中文意思是？`:`“${word}”对应的内容是？`,options:[right,wrong],answer:0,explain:`${word}：${right}。`});
  }
 }
}
const demoQuestions=questions.map((q,i)=>({...q,id:'demo-'+i,grade:3,subject:{数学:'math',语文:'chinese',英语:'english'}[q.subject],topic:q.subject==='数学'?'arithmetic':q.subject==='语文'?'poetry':'vocabulary'}));
const defaults={page:"home",period:30,dailyLimit:120,rest:10,grade:3,subject:"all",topic:"all",questionCount:5,requiredCorrect:5,dailyUsed:0,cycleUsed:0,question:0,correct:0,answerNote:"",phase:"available",restStart:0,activeQuestions:[],attempted:[],mistakes:[],history:[],bank:[],pinHash:null,pinSalt:null,failedPins:0,lockUntil:0,lastTime:0,day:"",audit:[]};
function clean(v,min,max,def){return Number.isInteger(v)&&v>=min&&v<=max?v:def;}
function validQuestion(q){return q&&typeof q.id==='string'&&q.id.length>0&&q.id.length<=80&&Number.isInteger(q.grade)&&q.grade>=1&&q.grade<=6&&Object.hasOwn(subjects,q.subject)&&Object.hasOwn(topics,q.topic)&&typeof q.text==='string'&&q.text.length>0&&q.text.length<=1000&&Array.isArray(q.options)&&q.options.length>=2&&q.options.length<=8&&q.options.every(o=>typeof o==='string'&&o.length>0&&o.length<=500)&&new Set(q.options).size===q.options.length&&Number.isInteger(q.answer)&&q.answer>=0&&q.answer<q.options.length&&typeof q.explain==='string'&&q.explain.length<=2000;}
function validateBank(bank){if(!Array.isArray(bank)||!bank.length||bank.length>2000||!bank.every(validQuestion)||new Set(bank.map(q=>q.id)).size!==bank.length)throw Error('题库格式错误：需 1–2000 道有效且 ID 唯一的题目');return bank;}
function dayKey(now){const d=new Date(now);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function restore(){try{
 const x=JSON.parse(localStorage.getItem(STORAGE)||"{}");const s=structuredDefaults();
 for(const [k,min,max] of [["period",5,120],["dailyLimit",15,600],["rest",0,60],["grade",1,6],["questionCount",1,20],["requiredCorrect",1,20],["dailyUsed",0,600],["cycleUsed",0,600],["question",0,20],["correct",0,20],["restStart",0,Number.MAX_SAFE_INTEGER],["failedPins",0,5],["lockUntil",0,Number.MAX_SAFE_INTEGER],["lastTime",0,Number.MAX_SAFE_INTEGER]]) s[k]=clean(x?.[k],min,max,s[k]);
 for(const [k,allowed] of Object.entries({page:['home','quiz','success','settings','review','records'],phase:['available','challenge','answering','rest','daily'],subject:['all',...Object.keys(subjects)],topic:['all',...Object.keys(topics)]}))if(allowed.includes(x?.[k]))s[k]=x[k];
 if(s.requiredCorrect>s.questionCount)s.requiredCorrect=s.questionCount;
 if(Array.isArray(x?.activeQuestions)&&x.activeQuestions.length<=20&&x.activeQuestions.every(validQuestion))s.activeQuestions=x.activeQuestions;
 if(Array.isArray(x?.attempted))s.attempted=x.attempted.slice(0,20).filter(n=>Number.isInteger(n)&&n>=0&&n<20);
 if(Array.isArray(x?.mistakes))s.mistakes=x.mistakes.filter(m=>validQuestion(m?.q)&&Number.isInteger(m.chosen)&&m.chosen>=0&&m.chosen<m.q.options.length).slice(-200);
 if(Array.isArray(x?.history))s.history=x.history.filter(r=>Number.isFinite(r?.at)&&Number.isInteger(r.total)&&r.total>0&&r.total<=20&&Number.isInteger(r.correct)&&r.correct>=0&&r.correct<=r.total&&typeof r.passed==='boolean').slice(-200);
 if(Array.isArray(x?.audit))s.audit=x.audit.filter(r=>Number.isFinite(r?.at)&&['settings','reset','unlock','import'].includes(r.type)).slice(-100);
 if(Array.isArray(x?.bank)&&x.bank.length){try{s.bank=validateBank(x.bank);}catch{s.answerNote='已忽略损坏题库，其他进度保留。';}}
 if(typeof x?.pinHash==='string'&&/^[a-f0-9]{64}$/.test(x.pinHash)&&typeof x.pinSalt==='string'&&/^[a-f0-9]{32}$/.test(x.pinSalt)){s.pinHash=x.pinHash;s.pinSalt=x.pinSalt;}
 if(typeof x?.day==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x.day))s.day=x.day;
 if(typeof x?.answerNote==='string')s.answerNote=x.answerNote.slice(0,2000);
 if(['answering','rest'].includes(s.phase)&&(!s.activeQuestions.length||s.activeQuestions.length!==s.questionCount||s.question>s.activeQuestions.length||s.correct>s.question||s.phase==='answering'&&s.question>=s.questionCount||s.phase==='rest'&&(s.question!==s.questionCount||s.correct<s.requiredCorrect||!s.restStart))){s.phase='challenge';s.question=0;s.correct=0;s.activeQuestions=[];}
 if(s.dailyUsed>=s.dailyLimit)s.phase='daily';
 return s;
 }catch{return structuredDefaults()}}
function structuredDefaults(){return {...defaults,activeQuestions:[],attempted:[],mistakes:[],history:[],bank:[],audit:[]};}
let s=restore();const el=document.getElementById("app"),nav=document.getElementById("nav");
let parentUntil=0,busy=false,storageError=false,reviewNote='',lastSaved=null,interactionPending=false,pendingFocus=null;
try{lastSaved=localStorage.getItem(STORAGE);}catch{storageError=true;}
const escapeHTML=x=>String(x).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
function syncState(){try{const raw=localStorage.getItem(STORAGE);if(raw!==lastSaved){s=restore();parentUntil=0;lastSaved=raw;return true;}}catch{storageError=true;}return false;}
function save(){try{const raw=localStorage.getItem(STORAGE);if(raw!==lastSaved){syncState();s.answerNote='检测到其他页面更新，已恢复最新进度，请重试操作。';return;}const serialized=JSON.stringify(s);localStorage.setItem(STORAGE,serialized);lastSaved=serialized;storageError=false;}catch{storageError=true;}}
function clock(){const now=Date.now();if(now<s.lastTime){s.answerNote='检测到时间回拨，休息资格暂停至时间恢复。';return false;}s.lastTime=now;const day=dayKey(now);if(!s.day)s.day=day;else if(day>s.day){s.day=day;s.dailyUsed=0;if(s.phase==='daily'){s.phase='available';s.cycleUsed=0;}}return true;}
function navigate(page){s.page=page;save();render();const heading=el.querySelector?.('h1');heading?.setAttribute('tabindex','-1');heading?.focus();}
function action(id,label,cls="secondary"){return '<button class="'+cls+'" data-action="'+id+'">'+label+'</button>'}
function authorized(){if(Date.now()<parentUntil)return true;s.answerNote='请先完成家长验证。';s.page='settings';save();render();return false;}
function audit(type){s.audit.push({type,at:Date.now()});s.audit=s.audit.slice(-100);}
function usage(min){clock();if(s.phase!=="available")return;s.dailyUsed=Math.min(s.dailyLimit,s.dailyUsed+min);s.cycleUsed=Math.min(s.period,s.cycleUsed+min);if(s.dailyUsed>=s.dailyLimit)s.phase="daily";else if(s.cycleUsed>=s.period)s.phase="challenge";save();render()}
function pool(){const bank=s.bank.length?s.bank:[...demoQuestions,...builtIn];return bank.filter(q=>q.grade===s.grade&&(s.subject==='all'||q.subject===s.subject)&&(s.topic==='all'||q.topic===s.topic));}
function start(){clock();if(s.phase!=="challenge")return;const selected=pool();if(selected.length<s.questionCount){s.answerNote=`匹配题目不足：仅 ${selected.length} 道，需要 ${s.questionCount} 道。请家长调整题库或条件。`;save();render();return;}s.activeQuestions=selected.slice(0,s.questionCount);s.attempted=[];s.page="quiz";s.question=0;s.correct=0;s.answerNote="";s.phase="answering";save();render()}
function choose(index,questionId){clock();if(s.phase!=="answering")return;const q=s.activeQuestions[s.question];if(questionId!==q.id)return;if(!Number.isInteger(index)||index<0||index>=q.options.length)return;const first=!s.attempted.includes(s.question);if(first)s.attempted.push(s.question);if(index!==q.answer){if(first){s.mistakes.push({q,chosen:index,at:Date.now()});s.mistakes=s.mistakes.slice(-200);}s.answerNote="再想一想："+q.explain;save();render();pendingFocus='[data-answer="'+index+'"]';if(!interactionPending){el.querySelector?.(pendingFocus)?.focus();pendingFocus=null;}return;}if(first)s.correct++;s.answerNote="";s.question++;if(s.question>=s.questionCount){const passed=s.correct>=s.requiredCorrect;s.history.push({at:Date.now(),correct:s.correct,total:s.questionCount,passed});s.history=s.history.slice(-200);s.phase=passed?"rest":"challenge";s.restStart=passed?Date.now():0;s.page="success";}save();render();const heading=el.querySelector?.('h1');heading?.setAttribute('tabindex','-1');heading?.focus();}
function finishRest(){if(!clock()){save();render();return;}if(s.phase!=="rest")return;const elapsed=Math.floor((Date.now()-s.restStart)/60000);if(elapsed<s.rest){s.answerNote="休息时间尚未达到 "+s.rest+" 分钟，目前约 "+Math.max(0,elapsed)+" 分钟。";save();render();return;}s.phase=s.dailyUsed>=s.dailyLimit?"daily":"available";s.cycleUsed=0;s.question=0;s.correct=0;s.activeQuestions=[];s.answerNote="";s.page="home";save();render()}
function reset(){if(!authorized()||!confirm("重置演示进度、错题与记录？保留家长 PIN。"))return;const {pinHash,pinSalt}=s;s={...structuredDefaults(),pinHash,pinSalt};audit('reset');clock();save();render()}
const hex=bytes=>Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');
async function pinDigest(pin,salt){const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);return hex(new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:100000,hash:'SHA-256'},material,256)));}
async function unlock(values={}){if(busy)return;busy=true;try{
 if(Date.now()<s.lockUntil){s.answerNote='验证失败次数过多，请一分钟后再试。';return;}
 const pin=fieldValue(values,'pin')||'';
 if(!/^\d{6,12}$/.test(pin)){s.answerNote='请输入 6–12 位数字 PIN。';return;}
 const snapshot=lastSaved,knownHash=s.pinHash,knownSalt=s.pinSalt;
 let salt=knownSalt,digest;
 if(!knownHash){if(pin!==fieldValue(values,'pinConfirm')){s.answerNote='两次 PIN 不一致。';return;}salt=hex(crypto.getRandomValues(new Uint8Array(16)));}
 digest=await pinDigest(pin,salt);
 if(lastSaved!==snapshot||localStorage.getItem(STORAGE)!==snapshot){syncState();parentUntil=0;s.answerNote='验证期间数据发生变化，请重新验证。';return;}
 if(knownHash&&digest!==knownHash){s.failedPins++;if(s.failedPins>=5){s.lockUntil=Date.now()+60000;s.failedPins=0;}s.answerNote='PIN 不正确。';return;}
 if(!knownHash){s.pinHash=digest;s.pinSalt=salt;}
 parentUntil=Date.now()+5*60000;s.failedPins=0;s.lockUntil=0;s.answerNote='家长验证成功，五分钟后自动锁定。';audit('unlock');
 }catch{s.answerNote='当前浏览器不支持安全验证，请使用现代浏览器或本机 HTTP 服务。';}finally{busy=false;save();render();}}
function saveSettings(values={}){if(!authorized())return;if(['answering','rest'].includes(s.phase)){s.answerNote='当前挑战或休息尚未完成，不能更改规则。';save();render();return;}
 for(const [k,min,max] of [["period",5,120],["dailyLimit",15,600],["rest",0,60],["grade",1,6],["questionCount",1,20],["requiredCorrect",1,20]])s[k]=clean(Number(fieldValue(values,k)),min,max,s[k]);
 s.requiredCorrect=Math.min(s.questionCount,s.requiredCorrect);
 for(const [k,allowed] of [['subject',['all',...Object.keys(subjects)]],['topic',['all',...Object.keys(topics)]]]){const v=fieldValue(values,k);if(allowed.includes(v))s[k]=v;}
 s.phase=s.dailyUsed>=s.dailyLimit?'daily':s.cycleUsed>=s.period?'challenge':'available';audit('settings');s.answerNote='设置已保存。';save();render();}
function importBank(values={}){if(!authorized())return;if(['answering','rest'].includes(s.phase)){s.answerNote='请完成挑战与休息后导入。';}else try{const text=fieldValue(values,'bank')||'';if(text.length>2000000)throw Error('题库文件过大');s.bank=validateBank(JSON.parse(text));s.answerNote=`已导入 ${s.bank.length} 道题。`;audit('import');}catch(e){s.answerNote=e.message;}save();render();}
function settingsFields(){return '<div class="formrow"><label for="requiredCorrect">首次答对题数要求</label><input id="requiredCorrect" type="number" min="1" max="20" value="'+s.requiredCorrect+'"></div>'+[['subject','学科',{all:'全部',...subjects}],['topic','知识点',{all:'全部',...topics}]].map(([id,label,values])=>'<div class="formrow"><label for="'+id+'">'+label+'</label><select id="'+id+'">'+Object.entries(values).map(([v,t])=>'<option value="'+v+'" '+(s[id]===v?'selected':'')+'>'+t+'</option>').join('')+'</select></div>').join('')+'<p>题库：'+(s.bank.length||builtIn.length+demoQuestions.length)+' 道。内置题仅为流程样例，不代表完整年级课程。</p><label for="bank">导入题库 JSON 数组（替换内置题库）</label><textarea id="bank" rows="6" style="width:100%" aria-describedby="bank-help"></textarea><p id="bank-help">格式与示例见使用说明；最多 2000 道，内容仅保存在本机。</p>'+action('import','校验并导入')+' '+action('lock','锁定家长设置');}
function render(){
 nav.innerHTML=[["home","儿童主页"],["quiz","学习挑战"],["success","挑战结果"],["review","错题本"],["records","学习记录"],["settings","家长设置"]].map(([id,label])=>'<button class="secondary" data-page="'+id+'" '+(s.page===id?'aria-current="page"':'')+'>'+label+'</button>').join("");
 const progress=Math.min(100,Math.round(s.dailyUsed/s.dailyLimit*100));
 let view="";
 if(s.page==="home"){
  view='<div class="grid"><section class="card"><h1>今天也要健康用屏 🌱</h1><p class="muted">合理使用平板，学习和休息都很重要。</p><div class="muted">本轮剩余时间</div><div class="big">'+Math.max(0,s.period-s.cycleUsed)+' <small style="font-size:20px">分钟</small></div><p>当前状态：<strong>'+({available:"可使用",challenge:"需要学习挑战",answering:"答题中",rest:"等待完成休息",daily:"已达每日上限"}[s.phase]||"未知")+'</strong></p>'+action("use","模拟使用 10 分钟","primary")+' '+action("fill","模拟用满当前周期")+'</section><section class="card"><h2>今日使用概览</h2><div class="stat">已使用 '+s.dailyUsed+' 分钟</div><div class="muted">每日上限 '+s.dailyLimit+' 分钟</div><div class="bar" role="progressbar" aria-label="今日使用分钟数" aria-valuemin="0" aria-valuenow="'+s.dailyUsed+'" aria-valuemax="'+s.dailyLimit+'"><div style="width:'+progress+'%"></div></div><p class="muted">每轮 '+s.period+' 分钟，答题 '+s.questionCount+' 道，休息 '+s.rest+' 分钟</p>'+(s.phase==="challenge"?action("start","开始学习挑战","primary"):s.phase==="rest"?action("success","查看解锁资格","primary"):s.phase==="daily"?'<div class="notice">已达到每日硬上限，答题不能继续换取时间。</div>':'')+'</section></div>';
 } else if(s.page==="quiz"){
  if(s.phase!=="answering"){view='<section class="card"><h1>学习挑战</h1><p>当前未处于答题状态。请先在主页模拟使用时间到期。</p>'+action("home","返回主页")+'</section>'}
  else {const q=s.activeQuestions[s.question];view='<div class="grid"><section class="card"><div class="muted">'+subjects[q.subject]+' · '+s.grade+' 年级</div><h1>第 '+(s.question+1)+' / '+s.questionCount+' 题</h1><div class="big" style="font-size:clamp(26px,4vw,44px)">'+escapeHTML(q.text)+'</div><p class="muted">请选出正确答案</p></section><section class="card"><h2>选择答案</h2><div class="choices">'+q.options.map((o,i)=>'<button data-question="'+escapeHTML(q.id)+'" data-answer="'+i+'">'+String.fromCharCode(65+i)+'　'+escapeHTML(o)+'</button>').join('')+'</div>'+(s.answerNote?'<p class="notice">'+escapeHTML(s.answerNote)+'</p>':'')+'</section></div>'}
 } else if(s.page==="review"){
  view='<section class="card"><h1>错题本</h1><p>最近 '+s.mistakes.length+' 道错题，最多保留 200 条。</p>'+s.mistakes.map((m,i)=>'<article><h2>'+escapeHTML(m.q.text)+'</h2><p>原选择：'+escapeHTML(m.q.options[m.chosen])+'</p>'+m.q.options.map((o,n)=>'<button class="secondary" data-review="'+i+'" data-choice="'+n+'">'+escapeHTML(o)+'</button>').join('')+'<details><summary>答案与讲解</summary><p>'+escapeHTML(m.q.explain)+'</p></details></article>').join('')+'<p role="status">'+escapeHTML(reviewNote)+'</p></section>';
 } else if(s.page==="records"){
  const total=s.history.reduce((n,r)=>n+r.total,0),correct=s.history.reduce((n,r)=>n+r.correct,0);
  view='<section class="card"><h1>学习记录</h1><p>挑战 '+s.history.length+' 次 · 通过 '+s.history.filter(r=>r.passed).length+' 次 · 首次正确率 '+(total?Math.round(correct/total*100):0)+'%</p><p>仅统计最近 200 次挑战，错题重试不计入首次正确。</p>'+s.history.slice().reverse().map(r=>'<p>'+escapeHTML(new Date(r.at).toLocaleString())+'：'+r.correct+'/'+r.total+' · '+(r.passed?'通过':'待练习')+'</p>').join('')+'</section>';
 } else if(s.page==="success"){
  view='<section class="card result"><h1>'+(s.phase==='rest'?'挑战成功，获得待生效资格':s.phase==='challenge'?'本轮未通过，请再练习':'尚无待生效资格')+'</h1><p>首次答对 '+s.correct+' / '+s.questionCount+' 题，通过要求 '+s.requiredCorrect+' 题。</p>'+(s.phase==='rest'?'<p>获得下一轮 '+s.period+' 分钟的待生效使用资格</p><p class="notice">必须先完成 '+s.rest+' 分钟休息，并且不能突破每日 '+s.dailyLimit+' 分钟上限。</p>'+action('rest','检查休息条件','primary'):s.phase==='challenge'?action('start','重新挑战','primary'):'')+'</section>';
 } else {
  view='<div class="grid"><section class="card"><h1>家长设置</h1><p class="notice">本地 PIN 仅为演示级保护；清除或修改浏览器数据可绕过，不能替代设备安全权限。</p><div class="formrow"><label for="period">单轮使用时长（分钟）</label><input id="period" type="number" min="5" max="120" value="'+s.period+'"></div><div class="formrow"><label for="dailyLimit">每日使用上限（分钟）</label><input id="dailyLimit" type="number" min="15" max="600" value="'+s.dailyLimit+'"></div><div class="formrow"><label for="rest">休息时间（分钟）</label><input id="rest" type="number" min="0" max="60" value="'+s.rest+'"></div><div class="formrow"><label for="grade">年级（1-6）</label><input id="grade" type="number" min="1" max="6" value="'+s.grade+'"></div><div class="formrow"><label for="questionCount">每轮题数（1-20）</label><input id="questionCount" type="number" min="1" max="20" value="'+s.questionCount+'"></div>'+settingsFields()+action("saveSettings","保存演示设置","primary")+'</section><section class="card"><h2>学习规则</h2><p>学科：语文、数学、英语</p><p>按首次作答计算通过要求；错题可练习，不能用重试提高本轮成绩。</p><p>答题成功并不自动解除每日硬上限。</p><p>本地浏览器保存数据，清除站点数据会丢失进度。</p>'+action("reset","重置演示数据","danger")+'</section></div>';
 }
 if(s.page==='settings'&&Date.now()>=parentUntil)view='<section class="card"><h1>家长验证</h1><p>首次由家长设置 6–12 位数字 PIN；此后验证才能修改规则、导入题库或重置。授权五分钟后失效。</p><p class="notice">本地演示级保护，清除或修改站点数据可绕过。请勿使用常用密码。</p><label for="pin">家长 PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="off" minlength="6" maxlength="12">'+(!s.pinHash?'<label for="pinConfirm">再次输入 PIN</label><input id="pinConfirm" type="password" inputmode="numeric" autocomplete="off" maxlength="12">':'')+action('unlock',s.pinHash?'验证 PIN':'设置 PIN','primary')+'</section>';
 el.innerHTML=view+(s.answerNote?'<p class="notice" role="status">'+escapeHTML(s.answerNote)+'</p>':'')+(storageError?'<p class="error" role="alert">无法保存本地数据，本次进度可能在关闭后丢失。请检查浏览器存储权限。</p>':'');
 if(interactionPending)setControlsBusy(true);
}
function handleClick(e,values){
 syncState();clock();
 const target=e.target.closest("button");if(!target)return;
 if(target.dataset.review!==undefined){const m=s.mistakes[Number(target.dataset.review)];if(m)reviewNote=Number(target.dataset.choice)===m.q.answer?'答对了！'+m.q.explain:'再试一次：'+m.q.explain;render();return;}
 if(target.dataset.page){navigate(target.dataset.page);return}
 if(target.dataset.answer!==undefined){choose(Number(target.dataset.answer),target.dataset.question);return}
 switch(target.dataset.action){
 case "home":navigate("home");break;
 case "use":usage(10);break;
 case "fill":usage(Math.max(0,s.period-s.cycleUsed));break;
 case "start":start();break;
 case "success":navigate("success");break;
 case "rest":finishRest();break;
 case "reset":reset();break;
 case "saveSettings":saveSettings(values);break;
 case "unlock":return unlock(values);
 case "lock":parentUntil=0;navigate('settings');break;
 case "import":importBank(values);break;
 }
}
function fieldValue(values,id){return Object.hasOwn(values,id)?values[id]:document.getElementById(id)?.value;}
function setControlsBusy(disabled){document.querySelectorAll?.('button,input,select,textarea').forEach(control=>{control.disabled=disabled;});}
document.addEventListener("click",e=>{
 if(!e.target.closest('button')||interactionPending)return;
 const values=Object.fromEntries(['pin','pinConfirm','period','dailyLimit','rest','grade','questionCount','requiredCorrect','subject','topic','bank'].map(id=>[id,document.getElementById(id)?.value]));
 interactionPending=true;setControlsBusy(true);
 const complete=()=>{interactionPending=false;setControlsBusy(false);if(pendingFocus){el.querySelector?.(pendingFocus)?.focus();pendingFocus=null;}};
 try{const result=withStateLock(()=>handleClick(e,values));if(result&&typeof result.finally==='function')return result.finally(complete);complete();return result;}catch(error){complete();throw error;}
});
function withStateLock(fn){if(typeof navigator!=='undefined'&&navigator.locks&&!(typeof location!=='undefined'&&location.protocol==='file:'))return navigator.locks.request('beaa-state',fn);return fn();}
if(typeof window!=='undefined')window.addEventListener('storage',e=>{if(e.key===STORAGE||e.key===null)withStateLock(()=>{if(syncState())render();});});
withStateLock(()=>{syncState();clock();save();render();});
</script>
</body></html>
