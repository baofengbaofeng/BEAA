<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>学知守护 · 交互原型</title>
<style>
:root{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#194e54;background:#eef8f5}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:13px;padding:12px 18px;min-height:48px}button:focus-visible,input:focus-visible{outline:3px solid #318e91;outline-offset:3px}.primary{background:#138b87;color:white}.secondary{background:#e3f3ef;color:#176c70}.danger{background:#fff1e7;color:#99552a}.layout{max-width:1180px;margin:auto;padding:24px}.top{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}.brand{font-size:28px;font-weight:800;color:#118684}.pill{border:1px solid #e5caa7;border-radius:24px;background:#fff7e9;padding:7px 13px;color:#8c6026;font-size:13px}nav{display:flex;gap:8px;flex-wrap:wrap}nav button[aria-current=page]{background:#128b87;color:white}main{min-height:420px}.card{background:#fff;border-radius:24px;padding:27px;box-shadow:0 9px 34px #1f8b7610}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.full{grid-column:1/-1}h1{font-size:clamp(25px,3vw,38px);margin:0 0 12px}h2{margin:0 0 15px;font-size:22px}p{line-height:1.65}.muted{color:#627f80}.big{font-size:clamp(42px,7vw,77px);font-weight:800;color:#0d8a88}.stat{font-size:22px;font-weight:700;margin:14px 0}.choices{display:grid;gap:12px}.choices button{text-align:left;background:#ddf3ee;font-size:20px;min-height:63px}.choices button:hover{background:#c9ebe3}.bar{height:12px;border-radius:12px;background:#e4efeb;overflow:hidden}.bar>div{height:100%;background:#46afa1;transition:width .25s}.formrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:14px 0;flex-wrap:wrap}input,select{border:1px solid #b9dcd6;border-radius:12px;padding:10px;background:#fff;min-width:105px;max-width:100%}.result{text-align:center}.emoji{font-size:75px}.notice{background:#fff7e9;border-radius:14px;padding:13px;color:#94622b}.ok{color:#087e6b}.error{color:#a64c3e}footer{font-size:13px;color:#688383;margin-top:26px;text-align:center}@media(max-width:760px){.layout{padding:14px}.card{padding:20px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.top{align-items:flex-start;flex-direction:column}.brand{font-size:24px}.choices button{font-size:19px}}
</style>
</head>
<body>
<div class="layout">
<header class="top"><div><div class="brand">📚 学知守护</div><div class="muted">让学习与快乐陪伴成长</div></div><span class="pill">浏览器演示 · 不具备设备管控权限</span></header>
<nav id="nav" aria-label="页面导航"></nav><main id="app" aria-live="polite"></main>
<footer>所有时间均为模拟测试数据，不能限制其他应用。此原型本地运行，不上传学习记录。</footer>
</div>
<script>
"use strict";
const STORAGE="beaa-web-preview-v1";
const questions=[
 {subject:"数学",text:"36 ÷ 4 + 7 = ?",options:["14","15","16","17"],answer:2,explain:"先算36÷4=9，再算9+7=16。"},
 {subject:"数学",text:"8 × 6 = ?",options:["42","48","54","56"],answer:1,explain:"8×6=48。"},
 {subject:"语文",text:"“春眠不觉晓”的下一句是？",options:["处处闻啼鸟","花落知多少","夜来风雨声","床前明月光"],answer:0,explain:"出自孟浩然《春晓》。"},
 {subject:"英语",text:"apple 的中文意思是什么？",options:["梨","香蕉","苹果","橙子"],answer:2,explain:"apple是苹果。"},
 {subject:"数学",text:"15 + 17 = ?",options:["30","31","32","33"],answer:2,explain:"15+17=32。"}
];
const defaults={page:"home",period:30,dailyLimit:120,rest:10,grade:3,questionCount:5,dailyUsed:0,cycleUsed:0,question:0,correct:0,answerNote:"",phase:"available",restStart:0};
function clean(v,min,max,def){const n=Number(v);return Number.isInteger(n)?Math.min(max,Math.max(min,n)):def;}
function restore(){try{const x=JSON.parse(localStorage.getItem(STORAGE)||"{}");const s={...defaults};for(const k of ["page","phase","answerNote"])if(typeof x[k]==="string")s[k]=x[k];for(const [k,min,max] of [["period",5,120],["dailyLimit",15,600],["rest",0,60],["grade",1,6],["questionCount",1,5],["dailyUsed",0,600],["cycleUsed",0,120],["question",0,4],["correct",0,5],["restStart",0,Number.MAX_SAFE_INTEGER]])s[k]=clean(x[k],min,max,defaults[k]);return s;}catch{return {...defaults}}}
let s=restore();const el=document.getElementById("app"), nav=document.getElementById("nav");
const escapeHTML=x=>String(x).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
function save(){localStorage.setItem(STORAGE,JSON.stringify(s))}
function navigate(page){s.page=page;save();render()}
function action(id,label,cls="secondary"){return '<button class="'+cls+'" data-action="'+id+'">'+label+'</button>'}
function usage(min){if(s.phase!=="available")return;s.dailyUsed=Math.min(s.dailyLimit,s.dailyUsed+min);s.cycleUsed+=min;if(s.dailyUsed>=s.dailyLimit)s.phase="daily";else if(s.cycleUsed>=s.period)s.phase="challenge";save();render()}
function start(){if(s.phase!=="challenge")return;s.page="quiz";s.question=0;s.correct=0;s.answerNote="";s.phase="answering";save();render()}
function choose(index){if(s.phase!=="answering")return;const q=questions[s.question];if(index!==q.answer){s.answerNote="再想一想："+q.explain;save();render();return;}s.correct++;s.answerNote="";s.question++;if(s.question>=s.questionCount){s.phase="rest";s.restStart=Date.now();s.page="success"}save();render()}
function finishRest(){if(s.phase!=="rest")return;const elapsed=Math.floor((Date.now()-s.restStart)/60000);if(elapsed<s.rest){s.answerNote="休息时间尚未达到 "+s.rest+" 分钟，目前约 "+Math.max(0,elapsed)+" 分钟。";save();render();return;}s.phase=s.dailyUsed>=s.dailyLimit?"daily":"available";s.cycleUsed=0;s.question=0;s.correct=0;s.answerNote="";s.page="home";save();render()}
function reset(){if(!confirm("重置所有演示进度与设置？"))return;s={...defaults};save();render()}
function render(){
 nav.innerHTML=[["home","儿童主页"],["quiz","学习挑战"],["success","挑战结果"],["settings","家长设置"]].map(([id,label])=>'<button class="secondary" data-page="'+id+'" '+(s.page===id?'aria-current="page"':'')+'>'+label+'</button>').join("");
 const progress=Math.min(100,Math.round(s.dailyUsed/s.dailyLimit*100));
 let view="";
 if(s.page==="home"){
  view='<div class="grid"><section class="card"><h1>今天也要健康用屏 🌱</h1><p class="muted">合理使用平板，学习和休息都很重要。</p><div class="muted">本轮剩余时间</div><div class="big">'+Math.max(0,s.period-s.cycleUsed)+' <small style="font-size:20px">分钟</small></div><p>当前状态：<strong>'+({available:"可使用",challenge:"需要学习挑战",answering:"答题中",rest:"等待完成休息",daily:"已达每日上限"}[s.phase]||"未知")+'</strong></p>'+action("use","模拟使用 10 分钟","primary")+' '+action("fill","模拟用满当前周期")+'</section><section class="card"><h2>今日使用概览</h2><div class="stat">已使用 '+s.dailyUsed+' 分钟</div><div class="muted">每日上限 '+s.dailyLimit+' 分钟</div><div class="bar" role="progressbar" aria-valuenow="'+s.dailyUsed+'" aria-valuemax="'+s.dailyLimit+'"><div style="width:'+progress+'%"></div></div><p class="muted">每轮 '+s.period+' 分钟，答题 '+s.questionCount+' 道，休息 '+s.rest+' 分钟</p>'+(s.phase==="challenge"?action("start","开始学习挑战","primary"):s.phase==="rest"?action("success","查看解锁资格","primary"):s.phase==="daily"?'<div class="notice">已达到每日硬上限，答题不能继续换取时间。</div>':'')+'</section></div>';
 } else if(s.page==="quiz"){
  if(s.phase!=="answering"){view='<section class="card"><h1>学习挑战</h1><p>当前未处于答题状态。请先在主页模拟使用时间到期。</p>'+action("home","返回主页")+'</section>'}
  else {const q=questions[s.question];view='<div class="grid"><section class="card"><div class="muted">'+q.subject+' · '+s.grade+' 年级</div><h1>第 '+(s.question+1)+' / '+s.questionCount+' 题</h1><div class="big" style="font-size:clamp(26px,4vw,44px)">'+escapeHTML(q.text)+'</div><p class="muted">请选出正确答案</p></section><section class="card"><h2>选择答案</h2><div class="choices">'+q.options.map((o,i)=>'<button data-answer="'+i+'">'+String.fromCharCode(65+i)+'　'+escapeHTML(o)+'</button>').join('')+'</div>'+(s.answerNote?'<p class="notice">'+escapeHTML(s.answerNote)+'</p>':'')+'</section></div>'}
 } else if(s.page==="success"){
  view='<section class="card result"><div class="emoji">'+(s.phase==="rest"?"🏆":"🌿")+'</div><h1>'+(s.phase==="rest"?"挑战成功，全部答对！":"挑战进度")+'</h1><p>获得下一轮 '+s.period+' 分钟的待生效使用资格</p><p class="notice">必须先完成 '+s.rest+' 分钟休息，并且不能突破每日 '+s.dailyLimit+' 分钟上限。</p>'+action("rest","检查休息条件","primary")+(s.answerNote?'<p class="error">'+escapeHTML(s.answerNote)+'</p>':'')+'</section>';
 } else {
  view='<div class="grid"><section class="card"><h1>家长设置</h1><p class="notice">演示设置，无密码保护。正式版本需要家长身份验证。</p><div class="formrow"><label for="period">单轮使用时长（分钟）</label><input id="period" type="number" min="5" max="120" value="'+s.period+'"></div><div class="formrow"><label for="dailyLimit">每日使用上限（分钟）</label><input id="dailyLimit" type="number" min="15" max="600" value="'+s.dailyLimit+'"></div><div class="formrow"><label for="rest">休息时间（分钟）</label><input id="rest" type="number" min="0" max="60" value="'+s.rest+'"></div><div class="formrow"><label for="grade">年级（1-6）</label><input id="grade" type="number" min="1" max="6" value="'+s.grade+'"></div><div class="formrow"><label for="questionCount">每轮题数（1-5）</label><input id="questionCount" type="number" min="1" max="5" value="'+s.questionCount+'"></div>'+action("saveSettings","保存演示设置","primary")+'</section><section class="card"><h2>学习规则</h2><p>学科：语文、数学、英语</p><p>严格模式：本轮全部答对</p><p>答题成功并不自动解除每日硬上限。</p><p>本地浏览器保存数据，清除站点数据会丢失进度。</p>'+action("reset","重置演示数据","danger")+'</section></div>';
 }
 el.innerHTML=view;
}
document.addEventListener("click",e=>{
 const target=e.target.closest("button");if(!target)return;
 if(target.dataset.page){navigate(target.dataset.page);return}
 if(target.dataset.answer!==undefined){choose(Number(target.dataset.answer));return}
 switch(target.dataset.action){
 case "home":navigate("home");break;
 case "use":usage(10);break;
 case "fill":usage(Math.max(0,s.period-s.cycleUsed));break;
 case "start":start();break;
 case "success":navigate("success");break;
 case "rest":finishRest();break;
 case "reset":reset();break;
 case "saveSettings":{
  for(const [k,min,max] of [["period",5,120],["dailyLimit",15,600],["rest",0,60],["grade",1,6],["questionCount",1,5]]){
   s[k]=clean(document.getElementById(k).value,min,max,defaults[k]);
  }
  if(s.dailyUsed>=s.dailyLimit)s.phase="daily";
  save();render();break;
 }
 }
});
render();
</script>
</body></html>
