<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家庭家长端</title>
<style>body{font:18px system-ui;background:#eef8f5;color:#194e54;max-width:900px;margin:auto;padding:24px}section{background:white;padding:24px;border-radius:20px;margin:20px 0}input,button,select{font:inherit;padding:12px;min-height:48px;max-width:100%;box-sizing:border-box;margin:6px}button{background:#d5eee5;border:0;border-radius:12px}label{display:block;margin-top:12px}ruby{display:inline-flex;flex-direction:column-reverse;white-space:normal;vertical-align:bottom}rt{display:block;font-size:.75em;line-height:1.5}#message{white-space:pre-wrap;overflow-wrap:anywhere}</style>
<h1>家庭家长端</h1><p>仅在你配置的家庭服务中分享脱敏摘要与明确指令。孩子设备需主动配对、联网检查；网页与鸿蒙离线演示不能限制整台设备。家长会话仅保存在本页内存，关闭或一小时后失效。</p>
<section><label for="password">家长服务长口令</label><input type="password" id="password" autocomplete="current-password"><button id="login">登录家长端</button><button id="logout">退出</button><button id="pair">生成十分钟单次配对码</button><button id="refresh">刷新设备摘要</button><p id="message" role="status"></p></section><div id="devices"></div>
<script src="/pinyin.js"></script><script src="/reading.js"></script><script>
let bearer='';const message=document.getElementById('message');
async function api(path,body){const response=await fetch('/v1/'+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+bearer},...(body?{body:JSON.stringify(body)}:{})});if(!response.ok)throw Error('request');return response.json();}
function button(parent,text,run){const b=document.createElement('button');b.textContent=text;b.onclick=()=>Promise.resolve().then(run).catch(()=>{message.textContent='操作未完成，请重新登录、刷新摘要并检查授权。';});parent.append(b);}
function line(parent,text){const p=document.createElement('p');p.textContent=text;parent.append(p);}
async function refresh(){const data=await api('devices');const root=document.getElementById('devices');root.replaceChildren();for(const d of data){const section=document.createElement('section');line(section,d.name+' · '+d.id.slice(0,8)+(d.revoked?' · 已撤销':''));if(d.summary){const s=d.summary;line(section,'已用 '+s.usedSeconds+' 秒 · 首答正确 '+s.correctCount+'/'+s.answeredCount+' · 修订 '+s.revision);const send=async(kind,extra={})=>{await api('commands',{deviceID:d.id,expectedRevision:s.revision,kind,...extra});message.textContent='指令已排队，五分钟内由上线的孩子设备检查；请刷新查看回执。';};button(section,'请求摘要',()=>send('requestSummary'));const minutes=document.createElement('input');minutes.type='number';minutes.min=1;minutes.max=30;minutes.value=5;const label=document.createElement('label');label.textContent='应急授权分钟';label.append(minutes);section.append(label);button(section,'应急授权',()=>send('emergencyGrant',{minutes:Number(minutes.value)}));button(section,'结束授权',()=>send('endGrant'));const policy=structuredClone(s.policy);const fields={period:'每轮分钟',dailyLimit:'每日分钟',rest:'休息分钟',grade:'年级',questionCount:'每轮题数',requiredCorrect:'至少首答正确题数'};for(const [key,text] of Object.entries(fields)){const l=document.createElement('label');l.textContent=text;const input=document.createElement('input');input.type='number';input.value=policy[key];input.oninput=()=>policy[key]=Number(input.value);l.append(input);section.append(l);}button(section,'发送规则',()=>send('setPolicy',{policy}));}else line(section,'等待孩子设备首次上传摘要。');if(d.receipt)line(section,'最新回执：'+(d.receipt.applied?'已应用':'已拒绝')+' · 修订 '+d.receipt.revision);if(!d.revoked)button(section,'撤销此设备配对',async()=>{await api('revoke',{deviceID:d.id});await refresh();});root.append(section);}}
document.getElementById('login').onclick=async()=>{const input=document.getElementById('password');try{const result=await api('login',{password:input.value});bearer=result.token;input.value='';message.textContent='家长端已登录';await refresh();}catch{input.value='';message.textContent='登录未完成，请检查口令或等待冷却结束。';}};
document.getElementById('logout').onclick=async()=>{try{if(bearer)await api('logout',{});}finally{bearer='';document.getElementById('devices').replaceChildren();message.textContent='已退出';}};
document.getElementById('pair').onclick=async()=>{try{const result=await api('pairs',{});message.textContent='单次配对码，十分钟有效，请私下交给孩子设备的已验证家长：\n'+result.code;}catch{message.textContent='请先登录';}};
document.getElementById('refresh').onclick=()=>refresh().catch(()=>{message.textContent='请重新登录并刷新';});
</script></html>
