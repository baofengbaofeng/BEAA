name: BEAA logic and native source checks

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, master]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run business and scaffold tests
        run: npm test
      - name: Run domain demonstration
        run: npm run demo
